# Durchgehende Pruefung fuer alle drei Sprachen des Repos. Manuelle Pruefung
# laeuft gegen die Testinstanz; ob das auch auf einer anderen Maschine
# ueberhaupt baut, ist damit nicht abgedeckt.
#
# Bewusst getrennte Jobs statt eines grossen: sie laufen parallel, und ein
# roter Job sagt sofort, WO es klemmt (Frontend, Backend, Sidecar, lokaler
# Konverter, info.xml).
name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Der Release-Workflow ruft genau diese Pruefungen als Pflicht-Vorstufe auf
  # (siehe release.yml). Was hier rot ist, wird nicht veroeffentlicht.
  workflow_call:
  # Fuer engine-release.yml: ein mit GITHUB_TOKEN gepushter Branch loest
  # keinen Lauf aus, workflow_dispatch ist von dieser Bremse ausgenommen.
  # Ohne das haette der Pin-PR des Bots kein Gate.
  workflow_dispatch:
  # Nur fuer den Advisory-Job: Eine Sicherheitsmeldung erscheint, ohne dass
  # hier jemand etwas aendert - ein Lauf allein bei Aenderungen faende sie
  # erst beim naechsten Commit. Montagmorgen, damit sie zum Wochenstart
  # dasteht.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Build, Tests, Linter, l10n)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scoreview
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Deckt sich mit "engines" in package.json.
          node-version: 22
          cache: npm
          cache-dependency-path: scoreview/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Stylelint
        run: npm run stylelint

      - name: Unit-Tests (vitest)
        run: npm test

      # Muss NACH den Tests laufen und ist trotzdem eine eigene Stufe: der
      # l10n-Vollstaendigkeitstest ist Teil von `npm test`, aber die
      # Skriptausgabe nennt die fehlenden Strings einzeln (siehe
      # tools/l10n.mjs) - das spart beim Roten das Nachschlagen.
      - name: Uebersetzungen vollstaendig
        run: npm run l10n:extract

      # Der Build ist Pflicht, weil scoreview/js/ gitignored ist: was hier
      # nicht baut, existiert in einem Release-Tarball gar nicht.
      - name: Produktionsbuild
        run: npm run build

  backend:
    name: Backend (PHP ${{ matrix.php }}, OCP ${{ matrix.ocp }})
    runs-on: ubuntu-latest
    # Ein beweglicher Zweig kann brechen, ohne dass hier jemand etwas getan
    # hat - diese eine Achse darf deshalb rot werden, ohne den Lauf zu
    # stoppen. Sobald NC 35 erschienen ist, wird daraus `^35.0` und die Zeile
    # hier faellt weg: Dann ist es ein fester Stand wie die anderen.
    # Nachgemessen am 2026-09-15: gegen dev-stable35 lief die Suite gruen.
    continue-on-error: ${{ matrix.unveroeffentlicht == true }}
    strategy:
      fail-fast: false
      matrix:
        # Unter- und Obergrenze aus appinfo/info.xml. Beide Enden bleiben
        # geprueft - wie bei Node und Python: max-version ist eine Zusage an
        # den App Store, und eine ungepruefte Zusage ist keine.
        #
        # Dasselbe gilt fuer NEXTCLOUD selbst, und das fehlte bis hierher:
        # info.xml verspricht 31-35, `nextcloud/ocp` stand aber auf `^31.0`
        # (also < 32). Getestet wurde damit ausschliesslich gegen die
        # Schnittstellen von NC 31 - eine Signaturaenderung in 32-35 waere
        # nirgends aufgefallen, obwohl die App mehrere OCP-Schnittstellen
        # implementiert (IEditor, IEventListener, Middleware, QBMapper).
        #
        # Drei Achsen, weil die zugesagte Obergrenze noch gar nicht draussen
        # ist: `nextcloud/ocp` hat als hoechsten STABILEN Stand v34, NC 35
        # existiert nur als Zweig `dev-stable35`. Geprueft wird deshalb der
        # hoechste veroeffentlichte Stand hart - und die eigentliche Zusage
        # zusaetzlich weich, siehe continue-on-error unten.
        include:
          - php: '8.1'
            ocp: '^31.0'
          - php: '8.5'
            ocp: '^34.0'
          - php: '8.5'
            ocp: 'dev-stable35'
            unveroeffentlicht: true
    defaults:
      run:
        working-directory: scoreview
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      # Vor dem Install, damit ein Fehler in composer.json auch als solcher
      # gemeldet wird und nicht als merkwuerdiger Aufloesungsfehler. --strict
      # zieht auch einen composer.lock hoch, der nicht mehr zur composer.json
      # passt. Nur auf der Achse, deren OCP-Stand der Lock auch abbildet - die
      # andere zieht ihn gleich planmaessig hoch und muss ihn verlassen.
      - name: composer.json und composer.lock pruefen
        if: matrix.ocp == '^31.0'
        run: composer validate --strict --no-check-publish

      # Die Untergrenze laeuft gegen den Lock (reproduzierbar), die Obergrenze
      # gegen frisch aufgeloeste Abhaengigkeiten. composer.json bleibt bei
      # `^31.0`: Sie ist die Zusage, die der Lock traegt - die Obergrenze ist
      # eine Pruefung, keine Festlegung.
      - name: OCP-Stand dieser Achse
        if: matrix.ocp != '^31.0'
        run: |
          # Ein Zweigstand ist per Definition instabil - ohne diese beiden
          # Zeilen lehnt composer ihn ab ("does not match your
          # minimum-stability"). prefer-stable haelt alles UEBRIGE stabil.
          if [ "${{ matrix.unveroeffentlicht }}" = "true" ]; then
            composer config minimum-stability dev
            composer config prefer-stable true
          fi
          composer require --dev --no-update --no-interaction "nextcloud/ocp:${{ matrix.ocp }}"
          composer update --no-interaction --no-progress

      - if: matrix.ocp == '^31.0'
        run: composer install --no-interaction --no-progress

      - name: Syntaxpruefung
        run: find lib templates appinfo -name '*.php' -print0 | xargs -0 -n1 php -l

      # Nur auf einer Version pruefen - der Codingstandard ist nicht
      # versionsabhaengig, und zwei identische Diffs helfen niemandem. Auf der
      # UNTERgrenze, nicht der oberen: php-cs-fixer lehnt eine PHP-Version ab,
      # die es noch nicht kennt, und das waere ein rotes CI ueber das Werkzeug
      # statt ueber den Code. Die Obergrenze traegt dafuer Syntaxpruefung und
      # Unit-Tests - das, was an ihr wirklich neu ist.
      - name: Codingstandard (nextcloud/coding-standard)
        if: matrix.php == '8.1'
        run: composer run cs:check

      - name: Unit-Tests (PHPUnit)
        run: composer run test:unit

  # Der lokale Konvertierungsweg (docs/architecture.md E3). Die reine
  # Umformungslogik deckt schon `npm test` im Frontend-Job ab; hier laeuft
  # der Weg EINMAL vollstaendig - mit echtem Engine-Wasm (scoreview-engine),
  # echter Partitur und den Zusagen aus M2/M4/M7 als Pruefung. Genau das
  # faengt ab, was ein Engine-Versionswechsel still kaputtmachen wuerde.
  konverter:
    name: Lokaler Konverter (scoreview-engine, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Unter- und Obergrenze der zugesagten Node-Spanne (siehe "engines" in
        # converter/package.json). Beide Enden bleiben geprueft, weil der
        # Emscripten-Glue je Version eigene Node-Ansprueche hat - die sollen
        # hier auffallen und nirgends sonst.
        node: ['18', '22']
    defaults:
      run:
        working-directory: scoreview/converter
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: scoreview/converter/package-lock.json

      # Kein `npm ci --omit=dev`: das Paket hat ohnehin nur Laufzeit-
      # Abhaengigkeiten, und der Release-Job soll denselben Baum bekommen.
      - run: npm ci

      - name: Selbsttest (echte Konvertierung, prueft M2/M4/M7)
        run: |
          ERGEBNIS=$(node convert.mjs --selftest 2>/dev/null)
          echo "$ERGEBNIS"
          echo "$ERGEBNIS" | node -e '
            const r = JSON.parse(require("fs").readFileSync(0, "utf8"))
            if (!r.ok) { console.error("Zusagen verletzt:", r.problems.join("; ")); process.exit(1) }
          '

  sidecar:
    name: Sidecar (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 ist die Systemversion von Ubuntu 22.04, auf dem das Image
        # aufsetzt (siehe sidecar/Dockerfile). Die zweite Version faengt
        # Unvertraeglichkeiten ab, bevor ein Basiswechsel sie zum Problem
        # macht.
        python: ['3.10', '3.12']
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - run: pip install -r requirements-dev.txt

      - name: Unit-Tests (pytest)
        run: python -m pytest

  # Der App Store validiert info.xml gegen dieses Schema und lehnt beim
  # Hochladen ab, was nicht passt - also nach dem Tag, wenn die Version schon
  # vergeben ist. Hier faellt es bei jedem Push auf. Eigener Job statt ein
  # Schritt im Backend: das ist reine XML-Pruefung und braucht kein PHP.
  appinfo:
    name: info.xml gegen App-Store-Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: xmllint installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils

      - name: Validieren
        run: |
          curl -fsSL https://apps.nextcloud.com/schema/apps/info.xsd -o /tmp/info.xsd
          xmllint --noout --schema /tmp/info.xsd scoreview/appinfo/info.xml

  # Beide Konvertierungswege muessen dieselbe MuseScore-Version fahren. Genau
  # das behauptet docs/architecture.md ("derselbe MuseScore 4.7.5, einmal als
  # AppImage und einmal Qt-frei"), und genau das hat bisher niemand geprueft:
  # der eine Pin steht als Release-URL in converter/package.json, der andere
  # als ARG im Dockerfile, und nichts verbindet sie. Laufen sie auseinander,
  # legt dieselbe Partitur je nach Weg ein anderes Layout hin - lautlos.
  # Eigener Job, weil das reine Textpruefung ist und weder Node noch Python
  # noch Docker braucht.
  versionen:
    name: Gleiche MuseScore-Version auf beiden Wegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Engine-Pin gegen Sidecar-Pin
        run: |
          PIN='https://github.com/AndiMb/scoreview-engine/releases/download/'
          URL=$(grep -o "${PIN}[^ ]*tgz" scoreview/converter/package.json)
          if [ -z "$URL" ]; then
            echo "Kein scoreview-engine-Pin in converter/package.json gefunden" >&2
            exit 1
          fi
          # Der Dateiname des Release-Pakets traegt die MuseScore-Version:
          # scoreview-engine-4.7.4.tgz
          ENGINE=$(basename "$URL" .tgz)
          ENGINE=${ENGINE#scoreview-engine-}
          SIDECAR=$(grep -m1 '^ARG MUSESCORE_VERSION=' sidecar/Dockerfile | cut -d= -f2)
          BUILD=$(grep -m1 '^ARG MUSESCORE_BUILD=' sidecar/Dockerfile | cut -d= -f2)
          echo "Engine (wasm):    $ENGINE"
          echo "Sidecar (AppImage): $SIDECAR (Build $BUILD)"

          if [ "$ENGINE" != "$SIDECAR" ]; then
            echo "Die beiden Konvertierungswege fahren verschiedene MuseScore-Versionen." >&2
            echo "  wasm:     $ENGINE   (scoreview/converter/package.json)" >&2
            echo "  AppImage: $SIDECAR  (sidecar/Dockerfile)" >&2
            echo "  -> beide zusammen heben, siehe docs/architecture.md" >&2
            exit 1
          fi

          case "$BUILD" in
            "$SIDECAR".*) ;;
            *)
              echo "MUSESCORE_BUILD ($BUILD) gehoert nicht zu MUSESCORE_VERSION ($SIDECAR)" >&2
              exit 1 ;;
          esac

  # Bekannte Sicherheitsluecken in den Abhaengigkeiten.
  #
  # Bewusst ein EIGENER Job und nicht ein Schritt in frontend/backend: Eine
  # neue Meldung soll CI rot machen - aber nicht so, dass die Testergebnisse
  # dahinter verschwinden. Wer den roten Punkt sieht, soll auf einen Blick
  # unterscheiden koennen, ob der Code kaputt ist oder die Welt sich geaendert
  # hat.
  #
  # `--audit-level=high`, nicht strenger: Die niedrigen Meldungen stammen
  # durchweg aus Webpacks Node-Polyfills (crypto-browserify und Angrenzendes),
  # laufen also zur BAUZEIT und landen in keinem Bundle. Sie jedes Mal rot zu
  # faerben hiesse, den Job binnen einer Woche zu ignorieren.
  advisories:
    name: Abhaengigkeiten (Sicherheitsmeldungen)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scoreview
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: npm (Laufzeit und Bauzeit)
        run: npm audit --audit-level=high

      # composer audit braucht nur den Lock, keine Installation.
      - name: composer
        run: composer audit --no-interaction --locked
