# Durchgehende Pruefung fuer alle drei Sprachen des Repos. Manuelle Pruefung
# laeuft gegen die Testinstanz; ob das auch auf einer anderen Maschine
# ueberhaupt baut, ist damit nicht abgedeckt.
#
# Bewusst getrennte Jobs statt eines grossen: sie laufen parallel, und ein
# roter Job sagt sofort, WO es klemmt (Frontend, Backend, Sidecar, lokaler
# Konverter, info.xml).
name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Der Release-Workflow ruft genau diese Pruefungen als Pflicht-Vorstufe auf
  # (siehe release.yml). Was hier rot ist, wird nicht veroeffentlicht.
  workflow_call:
  # Fuer engine-release.yml: ein mit GITHUB_TOKEN gepushter Branch loest
  # keinen Lauf aus, workflow_dispatch ist von dieser Bremse ausgenommen.
  # Ohne das haette der Pin-PR des Bots kein Gate.
  workflow_dispatch:
  # Nur fuer den Advisory-Job: Eine Sicherheitsmeldung erscheint, ohne dass
  # hier jemand etwas aendert - ein Lauf allein bei Aenderungen faende sie
  # erst beim naechsten Commit. Montagmorgen, damit sie zum Wochenstart
  # dasteht.
  #
  # Every other job carries `if: github.event_name != 'schedule'`: nothing
  # they test changes without a commit, and the full matrix every Monday
  # would only cost runner time.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Build, Tests, Linter, l10n)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scoreview
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Deckt sich mit "engines" in package.json.
          node-version: 24
          cache: npm
          cache-dependency-path: scoreview/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Stylelint
        run: npm run stylelint

      - name: Unit-Tests (vitest)
        run: npm test

      # Runs AFTER the tests and is still a step of its own: the l10n check
      # is part of `npm test`, but the script output names every finding and
      # the coverage per language (see tools/l10n.mjs) - that saves looking
      # it up when this is red. `check`, not `extract`: CI must not write.
      - name: Translations (l10n:check)
        run: npm run l10n:check

      # The user documentation is English with a maintained German copy
      # (*.de.md). Fails if a German file is older than its English original,
      # a language line or screenshot is missing, or any link or anchor in
      # the documentation is broken - translating a heading changes its
      # anchor. Plain Node, no dependencies, but scoped to the whole repo.
      - name: Documentation (docs:l10n)
        run: npm run docs:l10n

      # Der Build ist Pflicht, weil scoreview/js/ gitignored ist: was hier
      # nicht baut, existiert in einem Release-Tarball gar nicht.
      - name: Produktionsbuild
        run: npm run build

  backend:
    name: Backend (PHP ${{ matrix.php }}, OCP ${{ matrix.ocp }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Unter- und Obergrenze aus appinfo/info.xml. Beide Enden bleiben
        # geprueft - wie bei Node und Python: max-version ist eine Zusage an
        # den App Store, und eine ungepruefte Zusage ist keine.
        #
        # Dasselbe gilt fuer NEXTCLOUD selbst: info.xml verspricht 31-35,
        # `nextcloud/ocp` steht in composer.json aber auf `^31.0` (also < 32).
        # Ohne die obere Achse liefe die Suite ausschliesslich gegen die
        # Schnittstellen von NC 31 - eine Signaturaenderung in 32-35 fiele
        # nirgends auf, obwohl die App mehrere OCP-Schnittstellen implementiert
        # (IEditor, IEventListener, Middleware, QBMapper).
        #
        # PHP 8.5 auf der oberen Achse ist keine freie Wahl: `nextcloud/ocp`
        # v35 verlangt ~8.3 || ~8.4 || ~8.5.
        include:
          - php: '8.1'
            ocp: '^31.0'
          - php: '8.5'
            ocp: '^35.0'
    defaults:
      run:
        working-directory: scoreview
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      # Vor dem Install, damit ein Fehler in composer.json auch als solcher
      # gemeldet wird und nicht als merkwuerdiger Aufloesungsfehler. --strict
      # zieht auch einen composer.lock hoch, der nicht mehr zur composer.json
      # passt. Nur auf der Achse, deren OCP-Stand der Lock auch abbildet - die
      # andere zieht ihn gleich planmaessig hoch und muss ihn verlassen.
      - name: composer.json und composer.lock pruefen
        if: matrix.ocp == '^31.0'
        run: composer validate --strict --no-check-publish

      # Die Untergrenze laeuft gegen den Lock (reproduzierbar), die Obergrenze
      # gegen frisch aufgeloeste Abhaengigkeiten. composer.json bleibt bei
      # `^31.0`: Sie ist die Zusage, die der Lock traegt - die Obergrenze ist
      # eine Pruefung, keine Festlegung.
      #
      # `config.platform.php` (8.1) haelt den Lock auf der Untergrenze
      # installierbar - ohne den Pin loest Composer (und damit Dependabot)
      # nach der PHP-Version auf, mit der es gerade laeuft, und zieht Pakete
      # in den Lock, die PHP 8.1 nicht mehr installieren kann (OCP 35 will
      # 8.3, PHPUnit 13 will 8.4). Hier oben muss der Pin weg, sonst loeste
      # auch diese Achse fuer 8.1 auf und kaeme weder an OCP 35 noch an
      # PHPUnit 13 heran.
      - name: OCP-Stand dieser Achse
        if: matrix.ocp != '^31.0'
        run: |
          composer config --unset platform.php
          composer require --dev --no-update --no-interaction "nextcloud/ocp:${{ matrix.ocp }}"
          composer update --no-interaction --no-progress

      - if: matrix.ocp == '^31.0'
        run: composer install --no-interaction --no-progress

      - name: Syntaxpruefung
        run: find lib templates appinfo -name '*.php' -print0 | xargs -0 -n1 php -l

      # Nur auf einer Version pruefen - der Codingstandard ist nicht
      # versionsabhaengig, und zwei identische Diffs helfen niemandem. Auf der
      # UNTERgrenze, nicht der oberen: php-cs-fixer lehnt eine PHP-Version ab,
      # die es noch nicht kennt, und das waere ein rotes CI ueber das Werkzeug
      # statt ueber den Code. Die Obergrenze traegt dafuer Syntaxpruefung und
      # Unit-Tests - das, was an ihr wirklich neu ist.
      - name: Codingstandard (nextcloud/coding-standard)
        if: matrix.php == '8.1'
        run: composer run cs:check

      - name: Unit-Tests (PHPUnit)
        run: composer run test:unit

  # Static analysis against the OCP stubs of both ends (psalm.xml says why:
  # the unit tests run against mocks, which accept a deprecated or removed
  # method without a word). Its own job because Psalm 7 itself needs PHP
  # 8.2+; the analysis still targets 8.1 (phpVersion in psalm.xml). The
  # version is pinned to the one the config was checked with - a new Psalm
  # brings new checks, and that should be a change here, not a red CI.
  psalm:
    name: Psalm (OCP ${{ matrix.ocp }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ocp: ['^31.0', '^35.0']
    defaults:
      run:
        working-directory: scoreview
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2, psalm:7.0.0

      - name: OCP-Stand dieser Achse
        if: matrix.ocp != '^31.0'
        run: |
          composer config --unset platform.php
          composer require --dev --no-update --no-interaction "nextcloud/ocp:${{ matrix.ocp }}"
          composer update --no-interaction --no-progress

      - if: matrix.ocp == '^31.0'
        run: composer install --no-interaction --no-progress

      - name: Psalm
        run: psalm --no-cache --threads=2 --output-format=github

  # Der lokale Konvertierungsweg (docs/architecture.md E3). Die reine
  # Umformungslogik deckt schon `npm test` im Frontend-Job ab; hier laeuft
  # der Weg EINMAL vollstaendig - mit echtem Engine-Wasm (scoreview-engine),
  # echter Partitur und den Zusagen aus M2/M4/M7 als Pruefung. Genau das
  # faengt ab, was ein Engine-Versionswechsel still kaputtmachen wuerde.
  #
  # Run through LocalConverter itself (composer run test:sandbox), not as a
  # bare `node convert.mjs`: what is checked is the argv the app really
  # starts, sandbox flags and minimal environment included (S11) - and the
  # sandbox is checked by trying, with a probe that attempts what a
  # converter run must not do.
  konverter:
    name: Lokaler Konverter (scoreview-engine, ${{ matrix.runtime }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One runtime per sandbox level and flag name (ConverterRuntime):
        # 18 the lower bound of "engines" in converter/package.json, without
        # any permission model; 20 with --experimental-permission (Debian 13
        # ships it); 22 with --permission, network still open; 26 the current
        # LTS, which also blocks the network; deno the fully isolated
        # alternative (E18). The Emscripten glue has its own demands per
        # Node version - they should show up here and nowhere else.
        include:
          - { runtime: 'node-18', node: '18' }
          - { runtime: 'node-20', node: '20' }
          - { runtime: 'node-22', node: '22' }
          - { runtime: 'node-26', node: '26' }
          - { runtime: 'deno-2', node: '22', deno: 'v2.x' }
    defaults:
      run:
        working-directory: scoreview
    steps:
      - uses: actions/checkout@v7

      # Also for the deno run: node_modules is runtime-independent, and
      # npm installs it the same way release.yml does.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: scoreview/converter/package-lock.json

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: matrix.deno
        with:
          deno-version: ${{ matrix.deno }}

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      # Kein `npm ci --omit=dev`: das Paket hat ohnehin nur Laufzeit-
      # Abhaengigkeiten, und der Release-Job soll denselben Baum bekommen.
      - run: npm ci
        working-directory: scoreview/converter

      - run: composer install --no-interaction --no-progress

      - name: Abschottung und Selbsttest (echte Konvertierung, prueft M2/M4/M7 und S11)
        run: |
          if [ -n "${{ matrix.deno }}" ]; then
            RUNTIME=$(command -v deno)
          else
            RUNTIME=$(command -v node)
          fi
          "$RUNTIME" --version
          SCOREVIEW_RUNTIME="$RUNTIME" composer run test:sandbox

  sidecar:
    name: Sidecar (Python ${{ matrix.python }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 ist die Systemversion von Ubuntu 22.04, auf dem das Image
        # aufsetzt (siehe sidecar/Dockerfile). Die zweite Version faengt
        # Unvertraeglichkeiten ab, bevor ein Basiswechsel sie zum Problem
        # macht. requirements-dev.txt pulls in requirements.txt, so both run
        # against the Flask/Werkzeug/gunicorn pins the image installs.
        python: ['3.10', '3.12']
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - run: pip install -r requirements-dev.txt

      - name: Unit-Tests (pytest)
        run: python -m pytest

  # The sidecar image itself. The unit tests above replace every process
  # call; what only the built image shows - a wrong AppImage digest after a
  # bump by the engine bot, a file missing from the dockerignore allowlist,
  # a library gone from the apt set, a pin in requirements.txt that does not
  # install on the image's Python - surfaced only on a manual build.
  #
  # Path-filtered inside the job rather than with `on.paths`: that would
  # filter the whole workflow. The image takes sidecar/ and
  # scoreview/converter/ (the engine renderer); workflow_call (the release)
  # and workflow_dispatch (the engine bot's pin PR) always build.
  sidecar-image:
    name: Sidecar-Image (Build, Selbsttest beider Renderer)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Betroffen?
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          case "$EVENT" in
            pull_request|push) ;;
            *) echo "build=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          # A new branch has no "before" (all zeros); build rather than guess.
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] \
             || ! git fetch --quiet --depth=1 origin "$BASE"; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          GEAENDERT=$(git diff --name-only "$BASE" HEAD)
          echo "$GEAENDERT"
          if echo "$GEAENDERT" | grep -qE '^(sidecar/|scoreview/converter/|\.github/workflows/ci\.yml$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nichts am Image geaendert - Build uebersprungen."
          fi

      - name: Image bauen
        if: steps.filter.outputs.build == 'true'
        run: docker build -f sidecar/Dockerfile -t scoreview-sidecar-ci .

      # A throwaway secret: the container refuses to start without one, and
      # nothing it guards outlives this job.
      - name: Container starten
        if: steps.filter.outputs.build == 'true'
        run: |
          docker run -d --name sidecar-ci -p 8765:8765 \
            -e SCOREVIEW_SIDECAR_SECRET=ci-dummy-secret \
            --memory=2g --pids-limit=512 scoreview-sidecar-ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health >/dev/null 2>&1; then
              echo "Sidecar antwortet."
              exit 0
            fi
            sleep 2
          done
          echo "Sidecar antwortet nicht auf /health." >&2
          docker logs sidecar-ci >&2 || true
          exit 1

      # A real conversion per renderer against the bundled score, checked for
      # M2/M4/M7 (and, for the engine, M10, score facts, lyrics, variants).
      - name: Selbsttest beider Renderer
        if: steps.filter.outputs.build == 'true'
        run: |
          FEHLER=0
          for RENDERER in engine musescore; do
            ANTWORT=$(curl -sS --max-time 180 -H 'X-ScoreView-Secret: ci-dummy-secret' \
              "http://127.0.0.1:8765/selftest?renderer=$RENDERER")
            echo "$RENDERER: $ANTWORT" | head -c 2000; echo
            if [ "$(echo "$ANTWORT" | jq -r '.ok')" != "true" ]; then
              echo "Selbsttest fuer $RENDERER fehlgeschlagen." >&2
              FEHLER=1
            fi
          done
          exit $FEHLER

      # The Dockerfile's HEALTHCHECK has to work too - a broken one marks a
      # healthy sidecar as unhealthy in every orchestrator. Its first probe
      # runs one interval after the start.
      - name: HEALTHCHECK des Images
        if: steps.filter.outputs.build == 'true'
        run: |
          for _ in $(seq 1 30); do
            STATUS=$(docker inspect --format '{{.State.Health.Status}}' sidecar-ci)
            case "$STATUS" in
              healthy) echo "HEALTHCHECK: healthy"; exit 0 ;;
              unhealthy) break ;;
            esac
            sleep 3
          done
          echo "HEALTHCHECK meldet: $STATUS" >&2
          docker inspect --format '{{json .State.Health}}' sidecar-ci >&2
          exit 1

      - name: Container-Log
        if: always() && steps.filter.outputs.build == 'true'
        run: docker logs sidecar-ci 2>&1 | tail -n 100 || true

  # Der App Store validiert info.xml gegen dieses Schema und lehnt beim
  # Hochladen ab, was nicht passt - also nach dem Tag, wenn die Version schon
  # vergeben ist. Hier faellt es bei jedem Push auf. Eigener Job statt ein
  # Schritt im Backend: das ist reine XML-Pruefung und braucht kein PHP.
  appinfo:
    name: info.xml gegen App-Store-Schema
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: xmllint installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils

      - name: Validieren
        run: |
          curl -fsSL https://apps.nextcloud.com/schema/apps/info.xsd -o /tmp/info.xsd
          xmllint --noout --schema /tmp/info.xsd scoreview/appinfo/info.xml

  # Beide Konvertierungswege muessen dieselbe MuseScore-Version fahren. Genau
  # das behauptet docs/architecture.md ("derselbe MuseScore 4.7.6, einmal als
  # AppImage und einmal Qt-frei"), und genau das hat bisher niemand geprueft:
  # der eine Pin steht als Release-URL in converter/package.json, der andere
  # als ARG im Dockerfile, und nichts verbindet sie. Laufen sie auseinander,
  # legt dieselbe Partitur je nach Weg ein anderes Layout hin - lautlos.
  # Eigener Job, weil das reine Textpruefung ist und weder Node noch Python
  # noch Docker braucht.
  versionen:
    name: Gleiche MuseScore-Version auf beiden Wegen
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Engine-Pin gegen Sidecar-Pin
        run: |
          PIN='https://github.com/AndiMb/scoreview-engine/releases/download/'
          URL=$(grep -o "${PIN}[^ ]*tgz" scoreview/converter/package.json)
          if [ -z "$URL" ]; then
            echo "Kein scoreview-engine-Pin in converter/package.json gefunden" >&2
            exit 1
          fi
          # Der Dateiname des Release-Pakets traegt die MuseScore-Version:
          # scoreview-engine-4.7.4.tgz
          ENGINE=$(basename "$URL" .tgz)
          ENGINE=${ENGINE#scoreview-engine-}
          SIDECAR=$(grep -m1 '^ARG MUSESCORE_VERSION=' sidecar/Dockerfile | cut -d= -f2)
          BUILD=$(grep -m1 '^ARG MUSESCORE_BUILD=' sidecar/Dockerfile | cut -d= -f2)
          echo "Engine (wasm):    $ENGINE"
          echo "Sidecar (AppImage): $SIDECAR (Build $BUILD)"

          if [ "$ENGINE" != "$SIDECAR" ]; then
            echo "Die beiden Konvertierungswege fahren verschiedene MuseScore-Versionen." >&2
            echo "  wasm:     $ENGINE   (scoreview/converter/package.json)" >&2
            echo "  AppImage: $SIDECAR  (sidecar/Dockerfile)" >&2
            echo "  -> beide zusammen heben, siehe docs/architecture.md" >&2
            exit 1
          fi

          case "$BUILD" in
            "$SIDECAR".*) ;;
            *)
              echo "MUSESCORE_BUILD ($BUILD) gehoert nicht zu MUSESCORE_VERSION ($SIDECAR)" >&2
              exit 1 ;;
          esac

  # Bekannte Sicherheitsluecken in den Abhaengigkeiten.
  #
  # Bewusst ein EIGENER Job und nicht ein Schritt in frontend/backend: Eine
  # neue Meldung soll CI rot machen - aber nicht so, dass die Testergebnisse
  # dahinter verschwinden. Wer den roten Punkt sieht, soll auf einen Blick
  # unterscheiden koennen, ob der Code kaputt ist oder die Welt sich geaendert
  # hat.
  #
  # Schwelle "high", nicht strenger: Die niedrigen Meldungen stammen
  # durchweg aus Webpacks Node-Polyfills (crypto-browserify und Angrenzendes),
  # laufen also zur BAUZEIT und landen in keinem Bundle. Sie jedes Mal rot zu
  # faerben hiesse, den Job binnen einer Woche zu ignorieren.
  #
  # Aus demselben Grund `npm run audit` statt `npm audit`: Eine Meldung ohne
  # bereinigte Version laesst sich nur per datierter Ausnahme in
  # tools/audit-allowlist.json zuruecklassen, eine pro GHSA-Kennung.
  advisories:
    name: Abhaengigkeiten (Sicherheitsmeldungen)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scoreview
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: npm (Laufzeit und Bauzeit)
        run: npm run audit

      # composer audit braucht nur den Lock, keine Installation.
      - name: composer
        run: composer audit --no-interaction --locked
