# Baut den App-Tarball zu einem Tag. Der Grund, warum das ueberhaupt eine
# eigene Automatik braucht:
# `scoreview/js/` ist gitignored, ein aus dem Repo gepacktes `scoreview/`
# enthaelt also KEIN einziges Frontend-Bundle und waere unbrauchbar. Der
# Tarball muss aus einem echten Build entstehen, nicht aus einem Checkout.
name: Release

on:
  push:
    tags: ['v*']
  # Zum Ausprobieren, ohne einen Tag setzen zu muessen.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tarball:
    name: App-Tarball bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scoreview/package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Frontend bauen
        working-directory: scoreview
        run: |
          npm ci
          npm run build

      # Der lokale Konvertierungsweg (docs/architecture.md E3) muss FERTIG
      # INSTALLIERT ins Paket: eine Instanz ohne Container hat kein npm, mit
      # dem sie das nachholen koennte. Das sind rund 25 MB webmscore-Wasm im
      # Tarball - der Preis dafuer, dass ScoreView ohne Sidecar laeuft.
      - name: Konverter installieren (webmscore)
        working-directory: scoreview/converter
        run: npm ci --omit=dev

      - name: Gegenprobe - webmscore liegt im Paket
        working-directory: scoreview/converter
        run: |
          if [ ! -f node_modules/webmscore4/webmscore.lib.wasm ]; then
            echo "webmscore fehlt im Konverter - Release abgebrochen." >&2
            exit 1
          fi
          node convert.mjs --selftest 2>/dev/null

      # --no-dev ist hier wesentlich: autoload-dev haengt die OCP-Stubs aus
      # nextcloud/ocp ein (siehe composer.json). Die duerfen NIE mit
      # ausgeliefert werden - auf einer echten Instanz kommen die
      # OCP-Klassen vom Server, eine mitgelieferte Kopie wuerde sie
      # ueberschatten.
      - name: Autoloader ohne dev-Abhaengigkeiten
        working-directory: scoreview
        # --classmap-authoritative bewusst hier statt in composer.json:
        # dauerhaft gesetzt muesste man nach jeder neuen Klasse
        # `composer dump-autoload` laufen lassen, sonst finden die Tests sie
        # nicht - eine Falle, die schon einmal zugeschnappt ist.
        # Fuer das Release ist der authoritative Classmap dagegen richtig.
        run: composer install --no-dev --no-interaction --no-progress --optimize-autoloader --classmap-authoritative

      - name: Gegenprobe - keine OCP-Stubs im Autoloader
        working-directory: scoreview
        run: |
          if grep -q "nextcloud/ocp" vendor/composer/autoload_static.php; then
            echo "OCP-Stubs im Produktions-Autoloader - Release abgebrochen." >&2
            exit 1
          fi

      - name: Tarball packen
        run: |
          tar --create --gzip --file "scoreview.tar.gz" \
            --exclude='scoreview/node_modules' \
            --exclude='scoreview/converter/lib/*.test.mjs' \
            --exclude='scoreview/src' \
            --exclude='scoreview/tests' \
            --exclude='scoreview/tools' \
            --exclude='scoreview/.php-cs-fixer*' \
            --exclude='scoreview/.stylelintrc.json' \
            --exclude='scoreview/eslint.config.mjs' \
            --exclude='scoreview/package*.json' \
            --exclude='scoreview/webpack.config.js' \
            --exclude='scoreview/composer.json' \
            --exclude='scoreview/composer.lock' \
            scoreview
          tar --list --file scoreview.tar.gz | head -40

      - uses: actions/upload-artifact@v7
        with:
          name: scoreview-app
          path: scoreview.tar.gz

      - name: An das Release haengen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: scoreview.tar.gz
