# Baut den App-Tarball zu einem Tag, signiert ihn und meldet ihn beim
# Nextcloud App Store an. Der Grund, warum das ueberhaupt eine eigene
# Automatik braucht:
# `scoreview/js/` ist gitignored, ein aus dem Repo gepacktes `scoreview/`
# enthaelt also KEIN einziges Frontend-Bundle und waere unbrauchbar. Der
# Tarball muss aus einem echten Build entstehen, nicht aus einem Checkout.
#
# Der Ablauf ist bewusst: bauen -> AUSLIEFERUNGSBAUM ZUSAMMENSTELLEN ->
# signieren -> packen. Die Signatur listet jede Datei einzeln auf; wuerde
# erst signiert und danach beim Packen etwas ausgeschlossen, meldete die
# Integritaetspruefung jeder Instanz fehlende Dateien.
#
# Die drei Secrets sind optional: ohne sie baut der Job ein unsigniertes
# Paket und laedt nichts hoch - ein Fork kommt so trotzdem zu einem Tarball.
# Ihre Einrichtung steht in docs/development.md#veroeffentlichung-im-app-store.
name: Release

on:
  push:
    tags: ['v*']
  # Zum Ausprobieren, ohne einen Tag setzen zu muessen.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Die komplette CI als Pflicht-Vorstufe: eine Version, die Linter,
  # Unit-Tests, Codingstandard, den Konverter-Selbsttest oder die
  # Schema-Pruefung von info.xml nicht besteht, wird gar nicht erst gebaut -
  # geschweige denn signiert oder an den App Store gemeldet. Das kostet ein
  # paar Minuten vor jedem Tag; der Gegenwert ist, dass ein Release nie an
  # etwas scheitert, das die CI laengst wusste.
  pruefungen:
    name: CI
    uses: ./.github/workflows/ci.yml

  tarball:
    name: App-Tarball bauen
    needs: pruefungen
    runs-on: ubuntu-latest
    env:
      # Ueber env statt direkt ueber `secrets`, weil `if:`-Bedingungen den
      # secrets-Kontext nicht sehen.
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      APP_CERTIFICATE: ${{ secrets.APP_CERTIFICATE }}
      APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # Ganz vorn, weil danach zehn Minuten Build folgen und beides in einer
      # Sekunde zu pruefen ist. Ein Tag, der nicht zur Version in info.xml
      # passt, ergibt ein Paket, das jede Instanz unter der falschen Version
      # einspielt - und der App Store zieht seine Release-Notes aus dem
      # CHANGELOG-Abschnitt zur Version, ein fehlender Abschnitt faellt dort
      # also erst nach dem Hochladen auf.
      - name: Tag gegen info.xml und CHANGELOG pruefen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          XML_VERSION=$(grep -oP '(?<=<version>)[^<]+' scoreview/appinfo/info.xml | head -1)
          if [ "$VERSION" != "$XML_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zur Version $XML_VERSION in info.xml - Release abgebrochen." >&2
            exit 1
          fi
          # -F, damit die eckigen Klammern nicht als Zeichenklasse gelesen
          # werden. Was hinter der Version steht, bleibt bewusst ungeprueft:
          # CHANGELOG.md trennt das Datum mit einem Halbgeviertstrich ab, und
          # daran soll kein Release haengen.
          if ! grep -qF "## [$VERSION]" CHANGELOG.md; then
            echo "CHANGELOG.md hat keinen Abschnitt '## [$VERSION]' - Release abgebrochen." >&2
            exit 1
          fi
          echo "Tag, info.xml und CHANGELOG stimmen ueberein ($VERSION)."

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scoreview/package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Frontend bauen
        working-directory: scoreview
        run: |
          npm ci
          npm run build

      # Der lokale Konvertierungsweg (docs/architecture.md E3) muss FERTIG
      # INSTALLIERT ins Paket: eine Instanz ohne Container hat kein npm, mit
      # dem sie das nachholen koennte. Das sind rund 19 MB Engine-Wasm im
      # Tarball - der Preis dafuer, dass ScoreView ohne Sidecar laeuft.
      - name: Konverter installieren (scoreview-engine)
        working-directory: scoreview/converter
        run: npm ci --omit=dev

      - name: Gegenprobe - die Engine liegt im Paket
        working-directory: scoreview/converter
        run: |
          if [ ! -f node_modules/scoreview-engine/scoreview.lib.wasm ]; then
            echo "Die scoreview-engine fehlt im Konverter - Release abgebrochen." >&2
            exit 1
          fi
          node convert.mjs --selftest 2>/dev/null

      # --no-dev ist hier wesentlich: autoload-dev haengt die OCP-Stubs aus
      # nextcloud/ocp ein (siehe composer.json). Die duerfen NIE mit
      # ausgeliefert werden - auf einer echten Instanz kommen die
      # OCP-Klassen vom Server, eine mitgelieferte Kopie wuerde sie
      # ueberschatten.
      - name: Autoloader ohne dev-Abhaengigkeiten
        working-directory: scoreview
        # --classmap-authoritative bewusst hier statt in composer.json:
        # dauerhaft gesetzt muesste man nach jeder neuen Klasse
        # `composer dump-autoload` laufen lassen, sonst finden die Tests sie
        # nicht - eine Falle, die schon einmal zugeschnappt ist.
        # Fuer das Release ist der authoritative Classmap dagegen richtig.
        run: composer install --no-dev --no-interaction --no-progress --optimize-autoloader --classmap-authoritative

      - name: Gegenprobe - keine OCP-Stubs im Autoloader
        working-directory: scoreview
        run: |
          if grep -q "nextcloud/ocp" vendor/composer/autoload_static.php; then
            echo "OCP-Stubs im Produktions-Autoloader - Release abgebrochen." >&2
            exit 1
          fi

      # Was hier NICHT mitgeht und warum: Der App Store nimmt Archive nur bis
      # 20 MB an. Die Browser-Bundles der Engine braucht nur, wer sie im
      # Browser laufen laesst - hier konvertiert Node; die CJK-Fonts sind
      # 4,2 MB fuer chinesische, japanische und koreanische Liedtexte. Der
      # Konverter laeuft ohne beides (nachgemessen). Siehe docs/limits.md.
      - name: Auslieferungsbaum zusammenstellen
        run: |
          # pipefail ist hier keine Formalie: ohne ihn zaehlt nur der Status des
          # ENTPACKENDEN tar. Bricht das packende ab (fehlerhaftes Muster,
          # Lesefehler), entpackt das zweite den halben Strom erfolgreich, und
          # der Schritt gilt als gelungen - mit einem unvollstaendigen Paket.
          set -o pipefail
          rm -rf dist && mkdir -p dist
          # Kopiert ueber eine tar-Pipe statt mit cp+rm: Die Ausschluesse
          # tragen den vollen Pfad ab der Wurzel (`scoreview/node_modules`
          # trifft NICHT `scoreview/converter/node_modules`), und es bleibt bei
          # genau einer Liste - derselben, deren Ergebnis der Schritt darunter
          # nachzaehlt.
          tar --create --file - \
            --exclude='scoreview/node_modules' \
            --exclude='scoreview/src' \
            --exclude='scoreview/tests' \
            --exclude='scoreview/tools' \
            --exclude='scoreview/.php-cs-fixer*' \
            --exclude='scoreview/.stylelintrc.json' \
            --exclude='scoreview/eslint.config.mjs' \
            --exclude='scoreview/package.json' \
            --exclude='scoreview/package-lock.json' \
            --exclude='scoreview/webpack.config.js' \
            --exclude='scoreview/composer.json' \
            --exclude='scoreview/composer.lock' \
            --exclude='scoreview/converter/package-lock.json' \
            --exclude='scoreview/converter/lib/*.test.mjs' \
            --exclude='scoreview/converter/node_modules/scoreview-engine/scoreview.js' \
            --exclude='scoreview/converter/node_modules/scoreview-engine/scoreview.mjs' \
            --exclude='scoreview/converter/node_modules/@librescore' \
            scoreview | tar --extract --file - --directory dist
          du -sh dist/scoreview
          echo "Dateien: $(find dist/scoreview -type f | wc -l)"

      # Was hier stehen bleibt, entscheidet, ob die App auf einer fremden
      # Instanz ueberhaupt laeuft - deshalb nachgezaehlt statt gehofft.
      - name: Gegenprobe - der Auslieferungsbaum ist vollstaendig
        run: |
          for PFLICHT in \
            appinfo/info.xml \
            js/scoreview-viewer.js \
            js/scoreview-settings.js \
            lib/AppInfo/Application.php \
            l10n/de.js \
            l10n/de.json \
            vendor/autoload.php \
            converter/convert.mjs \
            converter/package.json \
            converter/selftest-score.mscz \
            converter/node_modules/scoreview-engine/scoreview.lib.wasm \
            converter/node_modules/scoreview-engine/scoreview.lib.data \
            converter/node_modules/scoreview-engine/scoreview.nodejs.cjs; do
            if [ ! -e "dist/scoreview/$PFLICHT" ]; then
              echo "Im Paket fehlt: $PFLICHT - Release abgebrochen." >&2
              exit 1
            fi
          done
          for VERBOTEN in src tests tools node_modules; do
            if [ -e "dist/scoreview/$VERBOTEN" ]; then
              echo "Im Paket steht $VERBOTEN, das dort nicht hingehoert - Release abgebrochen." >&2
              exit 1
            fi
          done
          echo "Auslieferungsbaum vollstaendig."

      # Der Selbsttest oben lief gegen den ENTWICKLUNGSBAUM - mit CJK-Fonts und
      # allen Browser-Bundles. Ausgeliefert wird ein anderer. Deshalb hier
      # nochmal, gegen genau das, was ins Paket geht: Ein Fehler in der
      # Ausschlussliste faellt sonst erst auf einer fremden Instanz auf.
      - name: Gegenprobe - der Konverter laeuft im Auslieferungsbaum
        working-directory: dist/scoreview/converter
        run: node convert.mjs --selftest 2>/dev/null

      # Der App Store nimmt nur signierte Apps an. Signiert wird mit dem
      # App-Zertifikat, das Nextcloud auf eine CSR hin ausstellt; `occ` gibt es
      # nur in einer installierten Instanz, deshalb der Container.
      - name: App signieren
        if: env.APP_PRIVATE_KEY != '' && env.APP_CERTIFICATE != ''
        run: |
          # Raeumt Schluessel und Container auch dann weg, wenn das Signieren
          # scheitert - sonst bliebe der unverschluesselte private Schluessel
          # auf einem selbstgehosteten Runner liegen.
          aufraeumen() { docker rm -f nc-sign >/dev/null 2>&1 || true; rm -rf /tmp/cert; }
          trap aufraeumen EXIT

          mkdir -p /tmp/cert && chmod 700 /tmp/cert
          printf '%s' "$APP_PRIVATE_KEY" > /tmp/cert/scoreview.key
          printf '%s' "$APP_CERTIFICATE" > /tmp/cert/scoreview.crt
          chmod 600 /tmp/cert/scoreview.key

          # NUR appinfo/ beschreibbar machen, und nur fuer diesen Schritt:
          # `occ` schreibt dort die signature.json, laeuft im Container aber
          # als www-data. Ein `chmod -R a+rwX` ueber den ganzen Baum landete
          # als 0666/0777 im Tarball - Nextclouds Installer stellt die Modi
          # beim Entpacken wieder her, und jede Instanz haette
          # weltbeschreibbaren PHP-Code im Webroot.
          chmod 777 dist/scoreview/appinfo

          # Der Baum haengt unter /signing und AUSDRUECKLICH NICHT unter
          # /var/www/html: Im Image ist der Webroot leer, der Entrypoint
          # befuellt ihn erst beim Start aus /usr/src/nextcloud - und nur
          # dann, wenn er ihn leer vorfindet. Ein Bind-Mount irgendwo darunter
          # legt seine Elternverzeichnisse vorab an, der Webroot ist damit
          # nicht mehr leer, `apps/` entsteht nie, und die Installation
          # bricht in einer Endlosschleife mit "Cannot write into apps
          # directory" ab (nachgestellt: schon ein leeres Verzeichnis
          # genuegt). Zum Signieren muss die App ohnehin nicht installiert
          # sein - `integrity:sign-app` liest den Pfad, den es bekommt.
          docker run -d --name nc-sign \
            -e SQLITE_DATABASE=nc.db \
            -e NEXTCLOUD_ADMIN_USER=admin \
            -e NEXTCLOUD_ADMIN_PASSWORD="$(openssl rand -hex 24)" \
            -v "$PWD/dist/scoreview:/signing/scoreview" \
            nextcloud:31
          BEREIT=nein
          for i in $(seq 1 60); do
            if docker exec -u www-data nc-sign php occ status 2>/dev/null | grep -q 'installed: true'; then
              BEREIT=ja
              break
            fi
            sleep 5
          done
          if [ "$BEREIT" != "ja" ]; then
            echo "Der Signier-Container wurde in 5 Minuten nicht betriebsbereit." >&2
            docker logs --tail 40 nc-sign >&2 || true
            exit 1
          fi

          # Schluessel und Zertifikat IN den Container kopieren statt sie
          # hineinzumounten: `occ` laeuft als www-data (uid 33), das
          # Schluesselverzeichnis auf dem Runner gehoert aber dem
          # Runner-Nutzer und ist 0700. www-data kommt dort nicht hinein, und
          # Nextcloud meldet das nicht als Rechteproblem, sondern als
          # `Private key "..." does not exists.` - es prueft mit
          # file_exists(), und das ist ohne Leserecht am Verzeichnis false.
          # Die Modi auf dem Runner zu lockern waere der falsche Ausweg: Der
          # unverschluesselte private Schluessel laege dort fuer jeden Prozess
          # offen. Die Kopie lebt nur im Container und geht mit ihm (trap).
          docker cp /tmp/cert/scoreview.key nc-sign:/tmp/scoreview.key
          docker cp /tmp/cert/scoreview.crt nc-sign:/tmp/scoreview.crt
          docker exec -u root nc-sign sh -c 'chown www-data:www-data /tmp/scoreview.key /tmp/scoreview.crt && chmod 600 /tmp/scoreview.key && chmod 644 /tmp/scoreview.crt'

          docker exec -u www-data nc-sign php occ integrity:sign-app \
            --privateKey=/tmp/scoreview.key \
            --certificate=/tmp/scoreview.crt \
            --path=/signing/scoreview
          test -s dist/scoreview/appinfo/signature.json
          chmod 755 dist/scoreview/appinfo

      - name: Tarball packen
        run: |
          # Modi vereinheitlichen, statt die des Runners zu uebernehmen: tar
          # speichert sie, und Nextclouds Installer stellt sie beim Entpacken
          # wieder her. Nichts im Paket darf fuer andere schreibbar sein.
          chmod -R u=rwX,go=rX dist/scoreview
          tar --create --gzip --file scoreview.tar.gz -C dist scoreview
          GROESSE=$(stat -c%s scoreview.tar.gz)
          echo "Tarball: $((GROESSE / 1048576)) MB ($GROESSE B)"
          # Der App Store lehnt Archive ueber 20 MB ab - lieber hier auffallen
          # als nach dem Hochladen.
          if [ "$GROESSE" -gt 20971520 ]; then
            echo "Tarball ueber der App-Store-Grenze von 20 MB - Release abgebrochen." >&2
            exit 1
          fi
          tar --list --file scoreview.tar.gz | head -20

      - uses: actions/upload-artifact@v7
        with:
          name: scoreview-app
          path: scoreview.tar.gz

      - name: An das Release haengen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: scoreview.tar.gz

      # Erst jetzt, weil der App Store das Archiv selbst herunterlaedt: die
      # Release-Datei muss oeffentlich liegen, bevor er davon erfaehrt.
      - name: Beim App Store anmelden
        if: startsWith(github.ref, 'refs/tags/v') && env.APPSTORE_TOKEN != '' && env.APP_PRIVATE_KEY != '' && env.APP_CERTIFICATE != ''
        run: |
          # Ohne diese Probe koennte ein fehlendes/falsch benanntes
          # APP_CERTIFICATE den Signierschritt still ueberspringen (ein
          # uebersprungener Schritt ist kein Fehlschlag) - und ein unsigniertes
          # Paket ginge an den App Store, ohne dass es irgendwo auffiele.
          if [ ! -s dist/scoreview/appinfo/signature.json ]; then
            echo "Das Paket ist nicht signiert - Anmeldung abgebrochen." >&2
            exit 1
          fi
          printf '%s' "$APP_PRIVATE_KEY" > /tmp/scoreview.key
          SIGNATUR=$(openssl dgst -sha512 -sign /tmp/scoreview.key scoreview.tar.gz | openssl base64 -A)
          rm -f /tmp/scoreview.key
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/scoreview.tar.gz"
          ANTWORT=$(curl -sS -w '\n%{http_code}' -X POST https://apps.nextcloud.com/api/v1/apps/releases \
            -H "Authorization: Token ${APPSTORE_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg d "$URL" --arg s "$SIGNATUR" '{download: $d, signature: $s, nightly: false}')")
          CODE=$(echo "$ANTWORT" | tail -1)
          echo "$ANTWORT" | head -n -1
          case "$CODE" in
            200|201) echo "App Store: Release angelegt/aktualisiert ($CODE)." ;;
            *) echo "App Store lehnte das Release ab (HTTP $CODE)." >&2; exit 1 ;;
          esac
