# Haelt die Abhaengigkeiten per automatischem PR aktuell. Woechentlich und
# gebuendelt, damit nicht jede Minor-Version einen eigenen PR erzeugt; jeder
# dieser PRs laeuft durch dieselbe CI wie jeder andere Beitrag (ci.yml).
#
# Vier Baeume statt einem, weil das Repo drei Sprachen mischt: scoreview/ und
# scoreview/converter/ haben getrennte package.json mit voellig verschiedenem
# Zweck (Oberflaeche gegen Konvertierung), der Sidecar ist Python. Die
# Verzeichnisse sind ab der Repo-Wurzel angegeben. Dazu kommen die
# Basis-Images des Sidecars (docker) und die GitHub Actions.
version: 2
updates:
  # Die App selbst - Vue, Nextcloud-Bibliotheken, Werkzeuge.
  - package-ecosystem: npm
    directory: /scoreview
    schedule:
      interval: weekly
    groups:
      npm-abhaengigkeiten:
        patterns: ['*']
    # stylelint is held on its major because @nextcloud/stylelint-config
    # declares a peer range on it (^17.9.1 as of 3.2.2); a major jump breaks
    # `npm ci` with ERESOLVE before any test runs (PR #35). Lift this once a
    # release of @nextcloud/stylelint-config accepts the next major.
    ignore:
      - dependency-name: stylelint
        update-types: ['version-update:semver-major']

  # Der lokale Konvertierungsweg (docs/architecture.md E3). Hier kann
  # Dependabot nur @librescore/fonts anfassen: scoreview-engine haengt an einer
  # Release-URL, und die kennt keine Registry - diesen Sprung schlaegt
  # .github/workflows/engine-release.yml als eigenen Pull Request vor. Einen schlechten Bump faengt der Selbsttest im
  # konverter-Job ab, der M2/M4/M7 gegen eine echte Partitur prueft.
  - package-ecosystem: npm
    directory: /scoreview/converter
    schedule:
      interval: weekly

  # PHP: ausschliesslich dev-Abhaengigkeiten (PHPUnit, Codingstandard,
  # OCP-Stubs). Die App selbst verlangt zur Laufzeit nichts ausser einer
  # PHP-Version - was auch der Grund ist, warum ein Bump hier nie eine Instanz
  # erreichen kann: das Release laeuft mit --no-dev. Vorschlaege bleiben auf
  # das beschraenkt, was PHP 8.1 installieren kann, weil composer.json
  # `config.platform.php` festnagelt (siehe Backend-Job in ci.yml).
  #
  # nextcloud/ocp is held on its major on purpose: the lock stands for the
  # LOWER end of the range info.xml promises (Nextcloud 31), the upper end is
  # resolved fresh by the second backend axis in ci.yml. Despite the platform
  # pin, Dependabot did propose the jump to 35 (PR #27), and following it
  # would have narrowed the promise to Nextcloud 35 only. Patch releases of
  # the same major still come through.
  - package-ecosystem: composer
    directory: /scoreview
    schedule:
      interval: weekly
    ignore:
      - dependency-name: nextcloud/ocp
        update-types: ['version-update:semver-major']

  # The sidecar's Python packages: requirements.txt pins what the image
  # installs into its venv (Flask, Werkzeug, gunicorn and their
  # dependencies), requirements-dev.txt adds pytest on top. One tree, so the
  # unit tests and the image move together; each bump runs through the
  # sidecar-image job in ci.yml, which builds the image and runs both
  # renderers' self-tests.
  - package-ecosystem: pip
    directory: /sidecar
    schedule:
      interval: weekly

  # The base images of sidecar/Dockerfile are pinned by digest (tag plus
  # sha256), which keeps a build reproducible but means security updates of
  # Ubuntu and Node arrive only with a deliberate bump - this is that bump.
  # Only digest updates under the same tag come through; version jumps are
  # held (ubuntu 22.04 -> 22.10 counts as minor), because both tags are
  # choices with reasons in the Dockerfile (Ubuntu 22.04 carries the
  # libraries the MuseScore AppImage is known to run with, Node 22 is the
  # permission-model line engine.py relies on). The
  # MuseScore AppImage itself is an ARG with a URL and a checksum and is
  # lifted by engine-release.yml, not here.
  - package-ecosystem: docker
    directory: /sidecar
    schedule:
      interval: weekly
    ignore:
      - dependency-name: ubuntu
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: node
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  # Third-party actions are pinned by commit SHA with the version as a
  # comment (`@<sha> # v1.2.3`); Dependabot updates both together. A tag
  # can be moved by whoever controls the action's repository, a SHA cannot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
